{% extends "store/base.html" %}

{% block title %}
    Login
{% endblock title %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center "style="margin-top: 11vh; margin-bottom: 11vh;">
        <div class="card shadow-lg" style="width: 100%; max-width: 700px;">
            <div class="card-body">
                <h2 class="text-center mb-4">Login to your account</h2>

                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label"><h5>Username</h5></label>
                        <input type="text" placeholder="Username" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password1" class="form-label"><h5>Password</h5></label>
                        <input type="password" placeholder="Password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-2">New User? <a href="{% url 'store:register' %}">Register Now</a></p>
            </div>
        </div>
    </div>
{% endblock content %}
